name: Label existing release as public alpha

on:
  push:
    branches: [main]
    paths: ['.github/workflows/promote-alpha.yml']

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Update release label and notes without changing its assets or tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit v0.1.0 --prerelease=false --latest --title 'Clean11 v0.1.0 — First Public Alpha' --notes-file docs/releases/0.1.0.md
