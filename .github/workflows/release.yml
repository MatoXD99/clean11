name: Publish preview installer

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate version and release notes
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Expected a vMAJOR.MINOR.PATCH tag.' }
          $version = $Matches[1]
          if (!(Test-Path "docs/releases/$version.md")) { throw 'Release notes are required.' }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer from tagged source
        run: ./installer/Build.ps1 -Version $env:RELEASE_VERSION

      - name: Check installer database and prerequisites
        run: ./installer/Verify-Package.ps1 -Package "artifacts/installer/Clean11-$env:RELEASE_VERSION-x64.msi"

      - name: Create draft with assets, then publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $env:RELEASE_VERSION
          $package = "artifacts/installer/Clean11-$version-x64.msi"
          gh release create $tag $package artifacts/installer/SHA256SUMS.txt --verify-tag --draft --prerelease --title "Clean11 v$version — First Public Preview" --notes-file "docs/releases/$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation or asset upload failed.' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed; the release remains a draft.' }
